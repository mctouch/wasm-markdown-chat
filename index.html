<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASM WebGPU Markdown + AI Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; background: #0d0d0d; overflow: hidden;
            font-family: 'Fredoka', 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
        }
        #canvas-container { width: 100%; height: calc(100% - 60px); position: relative; }
        canvas { width: 100%; height: 100%; display: block; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 18px; pointer-events: none; }
        #input-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #1a1a1a; border-top: 1px solid #333; display: flex; align-items: center; padding: 0 16px; gap: 12px; }
        #input-bar input {
            flex: 1; height: 40px; background: #2a2a2a; border: 1px solid #444; border-radius: 8px;
            color: #fff; padding: 0 12px; font-size: 15px;
            font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
        }
        #input-bar button {
            height: 40px; padding: 0 20px; background: #3b82f6; border: none; border-radius: 8px;
            color: #fff; font-weight: 600; cursor: pointer; font-size: 14px;
            font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
            letter-spacing: 0.3px;
        }
        #input-bar button:hover { background: #2563eb; }
        #input-bar button:disabled { background: #555; cursor: not-allowed; }
        #input-bar button.recording { background: #ef4444; }
        #input-bar button.recording:hover { background: #dc2626; }
        #api-key-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; }
        #api-key-box { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 24px; width: 400px; max-width: 90%; }
        #api-key-box h2 { color: #fff; margin-bottom: 12px; font-size: 18px; }
        #api-key-box p { color: #888; margin-bottom: 16px; font-size: 13px; line-height: 1.5; }
        #api-key-box input { width: 100%; height: 40px; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; color: #fff; padding: 0 12px; font-size: 14px; margin-bottom: 12px; }
        #api-key-box button { width: 100%; height: 40px; background: #3b82f6; border: none; border-radius: 8px; color: #fff; font-weight: 500; cursor: pointer; }
        #api-key-box button:hover { background: #2563eb; }
        #settings-btn { position: fixed; top: 12px; right: 12px; width: 32px; height: 32px; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; color: #888; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 50; }
        #typing {
            position: absolute;
            left: 16px;
            bottom: 68px;
            color: #888;
            font-size: 13px;
            display: none;
            white-space: nowrap;
            background: #1a1a1a;
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid #333;
            pointer-events: none;
            z-index: 10;
        }
        #scroll-bottom { position: absolute; bottom: 8px; right: 16px; width: 32px; height: 32px; background: #2a2a2a; border: 1px solid #444; border-radius: 50%; color: #888; font-size: 18px; cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 10; }
        #scroll-bottom:hover { background: #3a3a3a; color: #fff; }
        #voice-controls {
            display: flex; align-items: center; gap: 6px; margin-left: 4px;
        }
        #voice-controls button {
            height: 32px; padding: 0 10px; font-size: 12px; border-radius: 6px;
            min-width: 48px;
        }
        #voice-controls button.active { background: #22c55e; color: #fff; }
        #voice-controls button:not(.active) { background: #555; color: #ccc; }
        #voice-status { font-size: 11px; color: #888; min-width: 65px; white-space: nowrap; }
        /* Voice selector dropdown */
        #voice-select {
            height: 32px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #ccc;
            font-size: 12px;
            padding: 0 8px;
            cursor: pointer;
        }
        #voice-select:focus { outline: none; border-color: #3b82f6; }
        /* Avatar overlay panel */
        #avatar-panel {
            position: absolute;
            top: 48px;
            right: 12px;
            width: 200px;
            height: 260px;
            border-radius: 12px;
            overflow: hidden;
            border: none;
            background: transparent;
            z-index: 30;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #avatar-panel.avatar-idle {
            top: 50%;
            left: 50%;
            right: auto;
            width: min(80vw, 80vh * 0.77);
            height: min(80vh, 80vw / 0.77);
            transform: translate(-50%, -50%);
            z-index: 30;
            border-radius: 16px;
        }
        #canvas {
            position: relative;
            z-index: 10;
        }
        #avatar-canvas {
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div id="api-key-overlay">
        <div id="api-key-box">
            <h2>Enter Kimi API Key</h2>
            <p>Your API key is stored locally in your browser and sent directly to the Kimi API (api.moonshot.ai). It is never stored on our servers.</p>
            <input type="password" id="api-key-input" placeholder="sk-..." />
            <button id="api-key-save">Start Chat</button>
            <button id="api-key-clear" style="margin-top:8px;width:100%;height:32px;background:transparent;border:1px solid #444;border-radius:8px;color:#888;font-size:12px;cursor:pointer;">Clear Saved Key</button>
        </div>
    </div>

    <div id="canvas-container">
        <div id="loading">Loading WebGPU...</div>
        <div id="avatar-panel">
            <canvas id="avatar-canvas"></canvas>
        </div>
        <button id="scroll-bottom" title="Scroll to bottom">↓</button>
    </div>
    <button id="settings-btn" title="Change API Key">&#9881;</button>
    <div id="input-bar">
        <div id="typing">Kimi is thinking...</div>
        <input type="text" id="message-input" placeholder="Ask Kimi anything..." disabled />
        <button id="talk-btn" disabled>Talk</button>
        <button id="test-a2f-btn" disabled>A2F Talk</button>
        <button id="send-btn" disabled>Send</button>
        <div id="voice-controls">
            <select id="voice-select" title="Select voice">
                <option value="en_US-amy-medium">Amy (Female)</option>
                <option value="en_US-lessac-medium">Lessac (Female)</option>
            </select>
            <span id="voice-status">Voice: Ready</span>
            <button id="voice-toggle-btn" title="Toggle voice">🔇</button>
            <button id="speak-toggle-btn" class="active" title="Toggle auto-speak">🔊</button>
        </div>
    </div>

    <!-- Avatar renderer scripts (must load before module) -->
    <script src="avatar-webgpu.js?v=2073"></script>
    <script src="avatar-webgl2.js?v=2073"></script>
    <script src="viseme.js?v=2073"></script>
    <script src="node_modules/onnxruntime-web/dist/ort.min.js"></script>
    <script src="viseme-sync.js?v=2073"></script>
    <script src="piper-tts.js?v=2073"></script>
    <script src="a2f-bridge.js?v=2073"></script>

    <script type="module">
        import init, { boot_app, render_frame, read_pixels, init_kimi, send_message, scroll, resize, is_streaming, get_streaming_length, get_last_assistant_message } from './pkg/wasm_markdown_chat.js?v=2073';

        let isTyping = false;
        let streamingCheckInterval = null;
        let avatarRenderer = null;
        let avatarAnimFrame = null;
        let visemeAnimator = null;
        let visemeSyncPlayer = null;
        let lastAssistantText = '';

        // TTS state
        let audioCtx = null;
        let piperTTS = null;
        let voiceEnabled = true;  // overall voice on/off
        let speakEnabled = true;  // auto-speak responses

        // Speak the given text using server-side Piper TTS (correct espeak phonemization)
        async function speakResponse(text) {
            if (!audioCtx) {
                console.error('[piper-server] audioCtx is null');
                return;
            }
            try {
                // Resume with timeout — resume() can hang if no user gesture
                if (audioCtx.state === 'suspended') {
                    console.log('[piper-server] Resuming audio context...');
                    const resumeTimeout = new Promise((_, reject) => 
                        setTimeout(() => reject(new Error('resume timeout')), 200)
                    );
                    try {
                        await Promise.race([audioCtx.resume(), resumeTimeout]);
                        console.log('[piper-server] Context resumed, state:', audioCtx.state);
                    } catch (e) {
                        console.warn('[piper-server] Could not resume audio context:', e.message);
                        // Try to play anyway — sometimes resume() resolves late
                    }
                }
                
                const voiceSelect = document.getElementById('voice-select');
                const voice = voiceSelect ? voiceSelect.value : 'en_US-amy-medium';
                
                const ttsUrl = window.location.protocol + '//' + window.location.hostname + '/api/tts/v1/tts/synthesize';
                const resp = await fetch(ttsUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, voice })
                });
                if (!resp.ok) {
                    throw new Error('TTS server error: ' + resp.status);
                }
                
                const wavBlob = await resp.blob();
                const audioBuffer = await audioCtx.decodeAudioData(await wavBlob.arrayBuffer());
                
                const source = audioCtx.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(audioCtx.destination);
                const startTime = audioCtx.currentTime + 0.05;
                source.start(startTime);
                
                // Parse phoneme events from header
                let phonemeEvents = [];
                try {
                    const eventsJson = resp.headers.get('X-Phoneme-Events');
                    if (eventsJson) phonemeEvents = JSON.parse(eventsJson);
                } catch(e) {}
                
                // Use server-provided phoneme events for lip sync
                if (visemeSyncPlayer && phonemeEvents.length > 0) {
                    visemeSyncPlayer.schedule(phonemeEvents, startTime);
                    window.useVisemeSync = true;
                    source.onended = () => { window.useVisemeSync = false; };
                } else if (visemeAnimator) {
                    visemeAnimator.speak(text, audioBuffer.duration);
                }
                
                console.log('[piper-server] speaking (' + voice + '):', text.substring(0, 50) + '...');
            } catch (e) {
                console.error('[piper-server] failed:', e);
                if (visemeAnimator) visemeAnimator.speak(text);
            }
        }

        // Expose viseme animator for console testing
        window.__visemeAnimator = null;

        // Avatar blendshape bridge (called from Rust via eval or exposed function)
        window.updateAvatarBlendshapes = (weightsObj) => {
            if (!avatarRenderer) return;
            const arr = window.ARKIT_ORDER.map(name => weightsObj[name] || 0.0);
            avatarRenderer.setBlendshapesArray(arr);
        };

        window.ARKIT_ORDER = [
            'eyeLookUpLeft', 'eyeLookUpRight', 'eyeLookDownLeft', 'eyeLookDownRight',
            'eyeLookInLeft', 'eyeLookInRight', 'eyeLookOutLeft', 'eyeLookOutRight',
            'eyeBlinkLeft', 'eyeBlinkRight', 'eyeSquintLeft', 'eyeSquintRight',
            'eyeWideLeft', 'eyeWideRight',
            'browDownLeft', 'browDownRight', 'browInnerUp', 'browOuterUpLeft', 'browOuterUpRight',
            'noseSneerLeft', 'noseSneerRight',
            'cheekPuff', 'cheekSquintLeft', 'cheekSquintRight',
            'jawOpen', 'jawForward', 'jawLeft', 'jawRight',
            'mouthFunnel', 'mouthPucker', 'mouthLeft', 'mouthRight',
            'mouthSmileLeft', 'mouthSmileRight', 'mouthFrownLeft', 'mouthFrownRight',
            'mouthDimpleLeft', 'mouthDimpleRight', 'mouthStretchLeft', 'mouthStretchRight',
            'mouthRollLower', 'mouthRollUpper', 'mouthShrugLower', 'mouthShrugUpper',
            'mouthPressLeft', 'mouthPressRight',
            'mouthLowerDownLeft', 'mouthLowerDownRight', 'mouthUpperUpLeft', 'mouthUpperUpRight',
            'tongueOut'
        ];

        async function initAvatar() {
            const canvas = document.getElementById('avatar-canvas');
            if (!canvas) return;
            try {
                // Safari WebGPU does not support compute shaders for blendshapes; force WebGL2
                const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
                if (navigator.gpu && window.WebGPUAvatarRenderer && !isSafari) {
                    avatarRenderer = new window.WebGPUAvatarRenderer(canvas);
                    await avatarRenderer.init();
                    await avatarRenderer.loadModel('avatar.glb');
                } else if (window.WebGL2AvatarRenderer) {
                    if (isSafari) console.log('[avatar] Safari detected, using WebGL2 fallback');
                    avatarRenderer = new window.WebGL2AvatarRenderer(canvas);
                    await avatarRenderer.loadModel('avatar.glb');
                } else {
                    console.warn('[avatar] No renderer available');
                    return;
                }
                // Start avatar render loop
                let lastT = performance.now();
                let demoT = 0;
                let nextBlinkTime = 2 + Math.random() * 58; // first blink 2-60s after init
                let blinkProgress = 0;
                let isBlinking = false;
                visemeAnimator = new window.VisemeAnimator();
                window.__visemeAnimator = visemeAnimator;

                function avatarLoop() {
                    if (avatarRenderer) {
                        const now = performance.now();
                        const dt = (now - lastT) / 1000;
                        lastT = now;
                        demoT += dt;

                        let merged;
                        if (window.currentA2FWeights) {
                            // A2F-driven full-face animation
                            merged = window.currentA2FWeights;
                        } else if (window.useVisemeSync && visemeSyncPlayer) {
                            // Viseme sync driven by TTS playback
                            window.visemeSyncWeights = visemeSyncPlayer.getCurrentWeights(audioCtx.currentTime);
                            merged = window.visemeSyncWeights;
                        } else {
                            // 1. Idle animation (random blink, subtle brow)
                            const idleWeights = new Float32Array(52);

                            // Random blink: trigger every 60-120 seconds, blink lasts ~150ms
                            if (!isBlinking && demoT >= nextBlinkTime) {
                                isBlinking = true;
                                blinkProgress = 0;
                            }
                            let blink = 0;
                            if (isBlinking) {
                                blinkProgress += dt / 0.15; // 150ms full blink cycle
                                if (blinkProgress >= 1) {
                                    isBlinking = false;
                                    nextBlinkTime = demoT + 60 + Math.random() * 60;
                                } else {
                                    // Parabolic blink: fast close, hold slightly, fast open
                                    blink = Math.sin(blinkProgress * Math.PI) * 0.8;
                                }
                            }
                            idleWeights[window.ARKIT_ORDER.indexOf('eyeBlinkLeft')] = blink;
                            idleWeights[window.ARKIT_ORDER.indexOf('eyeBlinkRight')] = blink;
                            idleWeights[window.ARKIT_ORDER.indexOf('browInnerUp')] = Math.abs(Math.sin(demoT * 0.3)) * 0.08;
                            idleWeights[window.ARKIT_ORDER.indexOf('browOuterUpRight')] = Math.abs(Math.cos(demoT * 0.4)) * 0.06;

                            // 2. Viseme animation (lip-sync)
                            const visemeWeights = visemeAnimator ? visemeAnimator.update(dt) : new Float32Array(52);

                            // 3. Merge: viseme overrides idle for mouth/jaw, idle adds to everything else
                            merged = new Float32Array(52);
                            for (let i = 0; i < 52; i++) {
                                merged[i] = idleWeights[i] + visemeWeights[i];
                                if (merged[i] > 1.0) merged[i] = 1.0;
                            }
                        }

                        avatarRenderer.setBlendshapesArray(merged);
                        avatarRenderer.render(dt);
                    }
                    avatarAnimFrame = requestAnimationFrame(avatarLoop);
                }
                // Viseme sync player (time-synced lip-sync for TTS)
                visemeSyncPlayer = null;
                if (window.VisemeSyncPlayer) {
                    visemeSyncPlayer = new window.VisemeSyncPlayer();
                    window.__visemeSyncPlayer = visemeSyncPlayer;
                    console.log('[visemesync] player created');
                }
                window.useVisemeSync = false;
                // A2F bridge setup
                window.currentA2FWeights = null;
                const proxyBase = window.location.protocol + '//' + window.location.hostname + '/api/a2f';
                window.a2fBridge = new window.A2FBridge({
                    proxyUrl: proxyBase + '/v1/audio2face/stream',
                    onBlendshapes: (bsDict) => {
                        const arr = new Float32Array(52);
                        for (const [name, val] of Object.entries(bsDict)) {
                            // A2F returns PascalCase; ARKIT_ORDER is camelCase
                            const camel = name[0].toLowerCase() + name.slice(1);
                            const idx = window.ARKIT_ORDER.indexOf(camel);
                            if (idx >= 0) arr[idx] = val;
                        }
                        window.currentA2FWeights = arr;
                    },
                    onStatus: (msg) => {
                        const t = document.getElementById('typing');
                        if (t) { t.style.display = msg ? 'block' : 'none'; t.textContent = msg; }
                    },
                    onError: (msg) => console.error('[A2F]', msg)
                });
                avatarLoop();
                console.log('[avatar] initialized');
            } catch (e) {
                console.error('[avatar] init failed:', e);
                document.getElementById('avatar-status').textContent = 'Error';
            }
        }

        async function run() {
            if (!navigator.gpu) {
                document.getElementById('loading').textContent = 'WebGPU not supported';
                return;
            }
            await init();
            await boot_app();
            document.getElementById('loading').style.display = 'none';

            // Initialize avatar overlay
            initAvatar();

            // Initialize TTS
            // NOTE: AudioContext is created lazily on first user gesture (Safari autoplay policy)
            // audioCtx will be initialized in doSend() or other click handlers
            if (window.PiperTTS) {
                piperTTS = new window.PiperTTS('piper-voices/en_US-amy-medium.onnx', 'piper-voices/en_US-amy-medium.onnx.json');
                window.piperTTS = piperTTS;
                const voiceStatus = document.getElementById('voice-status');
                const voiceToggleBtn = document.getElementById('voice-toggle-btn');
                const speakToggleBtn = document.getElementById('speak-toggle-btn');

                function updateVoiceStatus(status) {
                    if (voiceStatus) voiceStatus.textContent = status;
                }

                async function initPiper() {
                    try {
                        updateVoiceStatus('Voice: Loading');
                        await piperTTS.load();
                        updateVoiceStatus('Voice: Ready');
                        voiceToggleBtn.classList.add('active');
                        console.log('[piper] TTS engine loaded');
                    } catch (e) {
                        console.error('[piper] load failed:', e);
                        updateVoiceStatus('Voice: Off');
                        voiceToggleBtn.classList.remove('active');
                        voiceEnabled = false;
                    }
                }
                initPiper();

                // Voice on/off toggle
                voiceToggleBtn.addEventListener('click', () => {
                    voiceEnabled = !voiceEnabled;
                    if (voiceEnabled) {
                        voiceToggleBtn.textContent = '🔊';
                        voiceToggleBtn.classList.add('active');
                        speakToggleBtn.closest('#voice-controls').querySelector('#voice-status').textContent =
                            piperTTS.loaded ? 'Voice: Ready' : 'Voice: Loading';
                    } else {
                        voiceToggleBtn.textContent = '🔇';
                        voiceToggleBtn.classList.remove('active');
                        updateVoiceStatus('Voice: Off');
                        // Unmute = re-enable auto-speak too
                        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                    }
                });

                // Speak toggle (auto-speak responses)
                speakToggleBtn.addEventListener('click', () => {
                    speakEnabled = !speakEnabled;
                    if (speakEnabled) {
                        speakToggleBtn.textContent = '🔊';
                        speakToggleBtn.classList.add('active');
                    } else {
                        speakToggleBtn.textContent = '🔇';
                        speakToggleBtn.classList.remove('active');
                    }
                });
            } else {
                const voiceStatus = document.getElementById('voice-status');
                if (voiceStatus) voiceStatus.textContent = 'Voice: —';
                console.warn('[piper] PiperTTS not available');
            }

            // Expose for console testing and pipeline integration
            // Avatar WS exports removed from this build

            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            async function loop() {
                render_frame();
                const pixels = await read_pixels();
                if (pixels.length > 0) {
                    const imageData = new ImageData(new Uint8ClampedArray(pixels), canvas.width, canvas.height);
                    ctx.putImageData(imageData, 0, 0);
                }
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);

            // Enable input after boot
            const msgInput = document.getElementById('message-input');
            const sendBtn = document.getElementById('send-btn');
            const typingIndicator = document.getElementById('typing');
            const scrollBottomBtn = document.getElementById('scroll-bottom');

            // Check for saved API key — pre-fill but don't auto-hide
            let savedKey = localStorage.getItem('kimi_api_key');
            if (savedKey && savedKey.startsWith('sk-test-')) {
                localStorage.removeItem('kimi_api_key');
                savedKey = null;
            }

            if (savedKey) {
                document.getElementById('api-key-input').value = savedKey;
                // Auto-start if key exists
                init_kimi(savedKey);
                document.getElementById('api-key-overlay').style.display = 'none';
                document.getElementById('message-input').disabled = false;
                document.getElementById('send-btn').disabled = false;
                document.getElementById('talk-btn').disabled = false;
                document.getElementById('test-a2f-btn').disabled = false;
                document.getElementById('message-input').focus();
            } else {
                document.getElementById('api-key-input').focus();
            }

            // API key save
            const talkBtn = document.getElementById('talk-btn');
            const testA2FBtn = document.getElementById('test-a2f-btn');
            document.getElementById('api-key-save').addEventListener('click', () => {
                const key = document.getElementById('api-key-input').value.trim();
                if (key) {
                    localStorage.setItem('kimi_api_key', key);
                    init_kimi(key);
                    document.getElementById('api-key-overlay').style.display = 'none';
                    msgInput.disabled = false;
                    sendBtn.disabled = false;
                    talkBtn.disabled = false;
                    testA2FBtn.disabled = false;
                    msgInput.focus();
                }
            });

            document.getElementById('api-key-clear').addEventListener('click', () => {
                localStorage.removeItem('kimi_api_key');
                document.getElementById('api-key-input').value = '';
                document.getElementById('api-key-input').focus();
            });

            document.getElementById('api-key-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    document.getElementById('api-key-save').click();
                }
            });

            // Settings button re-opens overlay
            document.getElementById('settings-btn').addEventListener('click', () => {
                const overlay = document.getElementById('api-key-overlay');
                overlay.style.display = 'flex';
                const input = document.getElementById('api-key-input');
                input.value = localStorage.getItem('kimi_api_key') || '';
                input.focus();
            });

            // Scroll to bottom button
            scrollBottomBtn.addEventListener('click', () => {
                for (let i = 0; i < 50; i++) {
                    scroll(1000);
                }
                scrollBottomBtn.style.display = 'none';
            });

            // Wheel scrolling
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                scroll(e.deltaY);
            }, { passive: false });

            // Window resize
            window.addEventListener('resize', () => {
                const container = document.getElementById('canvas-container');
                const w = container.clientWidth;
                const h = container.clientHeight;
                canvas.width = w;
                canvas.height = h;
                resize(w, h);
            });

            // Send message
            async function doSend() {
                // Lazy-create AudioContext on first user gesture (Safari autoplay policy)
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                // Resume audio context on user gesture (required for autoplay)
                if (audioCtx && audioCtx.state === 'suspended') {
                    try {
                        await audioCtx.resume();
                        console.log('[AUDIO] Context resumed on send');
                    } catch (err) {
                        console.error('[AUDIO] Failed to resume context:', err);
                    }
                }
                const text = msgInput.value.trim();
                if (!text || isTyping) return;
                msgInput.value = '';
                isTyping = true;
                sendBtn.disabled = true;
                typingIndicator.style.display = 'block';
                typingIndicator.textContent = 'Kimi is typing...';
                scrollBottomBtn.style.display = 'none';

                // Start avatar lip-sync with the user's text (placeholder until we get response text back)
                if (visemeAnimator) {
                    visemeAnimator.speak(text || 'Hello');
                }

                send_message(text);

                // Poll streaming progress
                streamingCheckInterval = setInterval(() => {
                    if (is_streaming()) {
                        const len = get_streaming_length();
                        typingIndicator.textContent = `Kimi is typing (${len} chars)...`;
                    } else {
                        clearInterval(streamingCheckInterval);
                        streamingCheckInterval = null;
                        isTyping = false;
                        sendBtn.disabled = false;
                        typingIndicator.style.display = 'none';
                        msgInput.focus();
                        // Auto-speak assistant response with TTS
                        const responseText = get_last_assistant_message();
                        if (responseText && piperTTS && piperTTS.loaded && voiceEnabled && speakEnabled) {
                            speakResponse(responseText).catch(e => console.error('[speakResponse]', e));
                        }
                        // Fallback: animate avatar lip-sync with the actual assistant response
                        if (visemeAnimator && responseText && (!piperTTS || !piperTTS.loaded || !voiceEnabled || !speakEnabled)) {
                            visemeAnimator.speak(responseText);
                        }
                    }
                }, 200);

                // Safety timeout in case streaming hangs
                setTimeout(() => {
                    if (isTyping) {
                        isTyping = false;
                        sendBtn.disabled = false;
                        typingIndicator.style.display = 'none';
                        if (streamingCheckInterval) {
                            clearInterval(streamingCheckInterval);
                            streamingCheckInterval = null;
                        }
                        msgInput.focus();
                    }
                }, 30000);
            }

            sendBtn.addEventListener('click', doSend);
            msgInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') doSend();
            });

            // Web Speech API ASR setup
            let recognition = null;
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'en-US';
                
                // Toggle-mode microphone: click to turn on, click again to turn off
                let micOn = false;
                let accumulatedText = '';
                
                recognition.onstart = () => {
                    talkBtn.classList.add('recording');
                };
                
                recognition.onresult = (event) => {
                    let finalTranscript = '';
                    let interimTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            finalTranscript += transcript;
                        } else {
                            interimTranscript += transcript;
                        }
                    }
                    if (finalTranscript) {
                        accumulatedText += finalTranscript + ' ';
                        msgInput.value = accumulatedText.trim();
                    }
                    if (interimTranscript) {
                        msgInput.placeholder = 'Listening: ' + interimTranscript;
                    }
                };
                
                recognition.onerror = (event) => {
                    console.error('[ASR] error:', event.error);
                    if (event.error === 'not-allowed') {
                        msgInput.placeholder = 'Microphone permission denied';
                        micOn = false;
                        talkBtn.classList.remove('recording');
                        talkBtn.textContent = '🎙️ Talk';
                    } else if (event.error === 'no-speech') {
                        msgInput.placeholder = 'No speech detected — click 🎙️ Talk to try again';
                    }
                };
                
                recognition.onend = () => {
                    if (micOn) {
                        // Unexpected stop while mic should be on (browser timeout) — restart
                        console.log('[ASR] Restarting continuous recognition');
                        try { recognition.start(); } catch(e) {}
                    } else {
                        // User toggled off — send accumulated text
                        talkBtn.classList.remove('recording');
                        talkBtn.textContent = '🎙️ Talk';
                        msgInput.placeholder = 'Ask Kimi anything...';
                        const text = msgInput.value.trim();
                        if (text && !isTyping) {
                            doSend();
                        }
                        accumulatedText = '';
                    }
                };
                
                talkBtn.addEventListener('click', () => {
                    if (!recognition) return;
                    micOn = !micOn;
                    if (micOn) {
                        accumulatedText = msgInput.value.trim();
                        if (accumulatedText) accumulatedText += ' ';
                        msgInput.value = '';
                        talkBtn.classList.add('recording');
                        talkBtn.textContent = '🔴 Listening';
                        try { recognition.start(); } catch(e) {}
                    } else {
                        talkBtn.classList.remove('recording');
                        talkBtn.textContent = '🎙️ Talk';
                        try { recognition.stop(); } catch(e) {}
                    }
                });
            } else {
                talkBtn.disabled = true;
                talkBtn.title = 'Speech recognition not supported in this browser';
            }

            // A2F Talk button: hold to record, release to send to A2F
            let a2fRecording = false;
            testA2FBtn.addEventListener('mousedown', () => {
                if (window.a2fBridge && !a2fRecording) {
                    a2fRecording = true;
                    testA2FBtn.classList.add('recording');
                    window.a2fBridge.startRecording();
                }
            });
            testA2FBtn.addEventListener('mouseup', () => {
                if (a2fRecording) {
                    a2fRecording = false;
                    testA2FBtn.classList.remove('recording');
                    if (window.a2fBridge) window.a2fBridge.stopRecording();
                }
            });
            testA2FBtn.addEventListener('mouseleave', () => {
                if (a2fRecording) {
                    a2fRecording = false;
                    testA2FBtn.classList.remove('recording');
                    if (window.a2fBridge) window.a2fBridge.stopRecording();
                }
            });
            testA2FBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (window.a2fBridge && !a2fRecording) {
                    a2fRecording = true;
                    testA2FBtn.classList.add('recording');
                    window.a2fBridge.startRecording();
                }
            });
            testA2FBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (a2fRecording) {
                    a2fRecording = false;
                    testA2FBtn.classList.remove('recording');
                    if (window.a2fBridge) window.a2fBridge.stopRecording();
                }
            });
        }
        // Mouse idle detection: avatar scales to center when idle, shrinks to corner on activity
        const avatarPanel = document.getElementById('avatar-panel');
        let idleTimer = null;
        const IDLE_DELAY_MS = 40000; // 40 seconds of inactivity before expanding

        function setAvatarIdle(isIdle) {
            if (!avatarPanel) return;
            if (isIdle) {
                avatarPanel.classList.add('avatar-idle');
            } else {
                avatarPanel.classList.remove('avatar-idle');
            }
        }

        function resetIdleTimer() {
            setAvatarIdle(false);
            if (idleTimer) clearTimeout(idleTimer);
            idleTimer = setTimeout(() => setAvatarIdle(true), IDLE_DELAY_MS);
        }

        window.addEventListener('mousemove', resetIdleTimer);
        window.addEventListener('mousedown', resetIdleTimer);
        window.addEventListener('keydown', resetIdleTimer);
        window.addEventListener('scroll', resetIdleTimer);
        window.addEventListener('touchstart', resetIdleTimer);
        // Start idle timer initially — avatar will expand after 40s if no interaction
        idleTimer = setTimeout(() => setAvatarIdle(true), IDLE_DELAY_MS);

        // === Avatar proactive speech: time + thoughts ===
        const THOUGHTS_AND_TIPS = [
            "Tip: Hold the Talk button to speak your message instead of typing.",
            "Tip: Try the A2F Talk button to see neural lip-sync with your own voice.",
            "Tip: You can change my voice between Amy and Lessac in the dropdown.",
            "Tip: Click the speaker icon to toggle auto-speak for responses.",
            "Did you know? I can process both text and voice input in the same conversation.",
            "Thought: The best conversations happen when you stop typing and start talking.",
            "Tip: Press Enter to send a message, or Shift+Enter for a new line.",
            "Tip: Scroll up to see your conversation history — it stays in context.",
            "Thought: Every question is a good question. What would you like to explore?",
            "Tip: The avatar will scale up when you're idle, and shrink back when you move the mouse.",
            "Did you know? A2F stands for Audio to Face — it converts your speech into facial animation in real time.",
            "Thought: The future of AI is not just text on a screen, but presence you can see and hear.",
        ];

        let lastInteractionTime = Date.now();
        let lastThoughtHour = -1;
        let thoughtMinute = Math.floor(Math.random() * 60); // random minute within the hour
        let lastQuarterAnnounced = -1;

        // Track all user interactions for "not being used" detection
        function updateInteractionTime() {
            lastInteractionTime = Date.now();
        }
        window.addEventListener('mousemove', updateInteractionTime);
        window.addEventListener('mousedown', updateInteractionTime);
        window.addEventListener('keydown', updateInteractionTime);
        window.addEventListener('scroll', updateInteractionTime);
        window.addEventListener('touchstart', updateInteractionTime);

        function speakText(text) {
            // Reuse the server TTS pipeline from speakResponse
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            const voice = document.getElementById('voice-select')?.value || 'en_US-amy-medium';
            fetch(window.location.protocol + '//' + window.location.hostname + '/api/tts/v1/tts/synthesize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text, voice: voice })
            })
            .then(r => r.ok ? r.arrayBuffer() : Promise.reject(new Error('TTS failed')))
            .then(buf => audioCtx.decodeAudioData(buf))
            .then(audioBuffer => {
                const source = audioCtx.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(audioCtx.destination);
                source.start();
            })
            .catch(err => console.error('[proactive speech]', err));
        }

        function announceTime() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            const h12 = hours % 12 || 12;
            const mStr = minutes === 0 ? 'o\'clock' : (minutes < 10 ? 'oh ' + minutes : minutes);
            const text = `The time is ${h12} ${mStr} ${ampm}.`;
            speakText(text);
        }

        function announceThought() {
            const thought = THOUGHTS_AND_TIPS[Math.floor(Math.random() * THOUGHTS_AND_TIPS.length)];
            speakText(thought);
        }

        // Check every 60 seconds
        setInterval(() => {
            const now = new Date();
            const minutes = now.getMinutes();
            const hours = now.getHours();
            const seconds = now.getSeconds();
            const msSinceInteraction = Date.now() - lastInteractionTime;

            // Quarter-hour time announcement: every 15 min (:00, :15, :30, :45)
            // Only if idle for at least 30 seconds and not already announced this quarter
            const quarter = Math.floor(minutes / 15);
            const quarterKey = hours * 4 + quarter;
            if (minutes % 15 === 0 && seconds < 5 && msSinceInteraction > 30000 && lastQuarterAnnounced !== quarterKey) {
                lastQuarterAnnounced = quarterKey;
                announceTime();
            }

            // Hourly thought/tip: at a random minute within the hour
            // Only if idle for at least 2 minutes and not already done this hour
            if (minutes === thoughtMinute && msSinceInteraction > 120000 && lastThoughtHour !== hours) {
                lastThoughtHour = hours;
                thoughtMinute = Math.floor(Math.random() * 60); // pick next hour's minute
                announceThought();
            }
        }, 60000);

        run().catch(e => {
            console.error(e);
            document.getElementById('loading').textContent = 'Error: ' + e;
        });
    </script>
</body>
</html>
